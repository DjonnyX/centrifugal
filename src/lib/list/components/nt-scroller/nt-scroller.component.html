@let filtered = motionBlurEnabled();
<div localeSensitive [langTextDir]="langTextDir()" [listDir]="direction()" class="ntvl__container"
    [ngClass]="containerClasses()">
    <svg part="viewport" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        <filter [id]="_filterId">
            <feGaussianBlur #filter></feGaussianBlur>
        </filter>
        <foreignObject xmlns="http://www.w3.org/1999/xhtml" width="100%" height="100%" class="ntvl__viewport">
            <div class="ntvl__scroller-wrapper" [class.filtered]="filtered" [style.filter]="filtered ? _filter : 'unset'">
                <div cdkScrollable #scrollViewport part="scroller" class="ntvl__scroller">
                    <div #scrollContent [attr.aria-orientation]="direction()"
                        [attr.aria-activedescendant]="focusedElement()" tabindex="0" part="list" class="ntvl__list"
                        [ngClass]="actualClasses()" [ngStyle]="listStyles()">
                        <ng-content></ng-content>
                    </div>
                </div>
            </div>
        </foreignObject>
    </svg>
    @if (scrollbarEnabled()) {
        @let prepared = preparedSignal();
        <nt-scroll-bar #scrollBar [context]="context()" [direction]="direction()" [langTextDir]="langTextDir()" [size]="thumbSize()" [renderer]="scrollbarThumbRenderer()"
            [thickness]="scrollbarThickness()" [params]="scrollbarThumbParams()" [loading]="loading()" [overlapping]="overlappingScrollbar()"
            [thumbGradientPositions]="thumbGradientPositions()" [prepared]="prepared" [interactive]="scrollbarInteractive()"
            [show]="scrollbarShow() && scrollbarEnabled() && prepared" [startOffset]="startOffset()" [langTextDir]="langTextDir()"
            [endOffset]="endOffset()" [overscrollEnabled]="overscrollEnabled()" [scrollBehavior]="scrollBehavior()"
            [scrollbarMinSize]="scrollbarMinSize()" (onDrag)="onScrollBarDragHandler($event)"
            (onDragEnd)="onScrollBarDragEndHandler($event)"></nt-scroll-bar>
    }
</div>
