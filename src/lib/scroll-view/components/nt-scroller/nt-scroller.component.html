@let filtered = motionBlurEnabled();
@let prepared = preparedSignal();
@let textDir = langTextDir();
<div localeSensitive [langTextDir]="textDir" [listDir]="direction()" class="ntvs__container"
    [ngClass]="containerClasses()">
    <svg part="nt-scroller-viewport" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink">
        <filter [id]="_filterId">
            <feGaussianBlur #filter></feGaussianBlur>
        </filter>
        <foreignObject xmlns="http://www.w3.org/1999/xhtml" width="100%" height="100%" class="ntvs__viewport">
            <div class="ntvs__scroller-wrapper" [class.filtered]="filtered"
                [style.filter]="filtered ? _filter : 'unset'" [ngStyle]="wrapperStyles()" [ngClass]="wrapperClass()">
                <div cdkScrollable #scrollViewport part="nt-scroller" class="ntvs__scroller">
                    <div #scrollContent [attr.aria-orientation]="direction()"
                        [attr.aria-activedescendant]="focusedElement()" tabindex="-1" part="nt-scroller-content"
                        class="ntvs__content" [ngClass]="actualClasses()" [ngStyle]="listStyles()">
                        <ng-content></ng-content>
                    </div>
                </div>
            </div>
            <nt-overscroll-container class="ntoa" dir="ltr" [bounds]="viewportBounds()" [leftOffset]="_leftOffset()" [topOffset]="_topOffset()"
                [rightOffset]="_rightOffset()" [bottomOffset]="_bottomOffset()" [overscrollEvent]="$overscroll | async"
                [leftIndicatorEnabled]="_actualOverscrollAreaLeftEnabled()" [topIndicatorEnabled]="_actualOverscrollAreaTopEnabled()"
                [rightIndicatorEnabled]="_actualOverscrollAreaRightEnabled()" [bottomIndicatorEnabled]="_actualOverscrollAreaBottomEnabled()"
                [leftIndicatorRenderer]="overscrollAreaLeftRenderer()" [topIndicatorRenderer]="overscrollAreaTopRenderer()"
                [rightIndicatorRenderer]="overscrollAreaRightRenderer()" [bottomIndicatorRenderer]="overscrollAreaBottomRenderer()"
                (onLeftAreaTrigger)="onLeftOverscrollAreaTrigger.emit($event)" (onTopAreaTrigger)="onTopOverscrollAreaTrigger.emit($event)" 
                (onRightAreaTrigger)="onRightOverscrollAreaTrigger.emit($event)" (onBottomAreaTrigger)="onBottomOverscrollAreaTrigger.emit($event)"/>
        </foreignObject>
    </svg>
    @if (scrollbarEnabled()) {
        @let parent = context();
        @if (scrollbarVerticalEnabled()) {
            <nt-base-slider #scrollBarVertical direction="vertical" [size]="thumbSizeVertical()" [context]="parent"
                [renderer]="scrollbarThumbRenderer()" [thickness]="scrollbarThickness()" [params]="scrollbarThumbParams()"
                [loading]="loading()" [overlapping]="overlappingScrollbar()"
                [thumbGradientPositions]="thumbGradientPositionsVertical()" [prepared]="prepared"
                [interactive]="scrollbarInteractive()" [show]="scrollbarVerticalEnabled() && scrollbarEnabled() && prepared"
                [topOffset]="topOffset()" [langTextDir]="textDir" [bottomOffset]="bottomOffset()"
                [overscrollEnabled]="overscrollEnabled()" [scrollBehavior]="scrollBehavior()"
                [sliderMinSize]="scrollbarMinSize()" (onDrag)="onScrollBarDragHandler($event)"
                (onDragEnd)="onScrollBarDragEndHandler($event)"></nt-base-slider>
        }
        @if (scrollbarHorizontalEnabled()) {
            <nt-base-slider #scrollBarHorizontal direction="horizontal" [size]="thumbSizeHorizontal()" [context]="parent"
                [renderer]="scrollbarThumbRenderer()" [thickness]="scrollbarThickness()" [params]="scrollbarThumbParams()"
                [loading]="loading()" [overlapping]="overlappingScrollbar()"
                [thumbGradientPositions]="thumbGradientPositionsHorizontal()" [prepared]="prepared"
                [interactive]="scrollbarInteractive()" [show]="scrollbarHorizontalEnabled() && scrollbarEnabled() && prepared"
                [leftOffset]="leftOffset()" [langTextDir]="textDir" [rightOffset]="rightOffset()"
                [overscrollEnabled]="overscrollEnabled()" [scrollBehavior]="scrollBehavior()"
                [sliderMinSize]="scrollbarMinSize()" (onDrag)="onScrollBarDragHandler($event)"
                (onDragEnd)="onScrollBarDragEndHandler($event)"></nt-base-slider>
        }
    }
</div>
