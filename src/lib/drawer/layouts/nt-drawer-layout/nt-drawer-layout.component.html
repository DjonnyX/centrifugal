<div class="ntdc-layout" part="nt-drawer-layout" [style.--width]="width() + 'px'" [style.--height]="height() + 'px'"
    [style.--left-size]="dockLeftSize() + 'px'" [style.--top-size]="dockTopSize() + 'px'"
    [style.--bottom-size]="dockBottomSize() + 'px'" [style.--right-size]="dockRightSize() + 'px'">
    <div></div>
    <div class="ntdc-dock-top" part="nt-drawer-dock-top">
        @let topContent = dockTop();
        @if (!!topContent) {
            <ng-container [ngTemplateOutlet]="topContent" />
        }
    </div>
    <div></div>
    <div class="ntdc-dock-left" part="nt-drawer-dock-left">
        @let leftContent = dockLeft();
        @if (!!leftContent) {
            <ng-container [ngTemplateOutlet]="leftContent" />
        }
    </div>
    <div class="ntdc-dock-content" part="nt-drawer-dock-content">
        <ng-content></ng-content>
        @if (opened() && backdrop()) {
            <div ntControl class="ntdc-overlay" part="nt-drawer-overlay" [style.opacity]="1 - scrollRatio()"
                (onVirtualClick)="onBackdrop.emit()"></div>
        }
    </div>
    <div class="ntdc-dock-right" part="nt-drawer-dock-right">
        @let rightContent = dockRight();
        @if (!!rightContent) {
            <ng-container [ngTemplateOutlet]="rightContent" />
        }
    </div>
    <div></div>
    <div class="ntdc-dock-bottom" part="nt-drawer-dock-bottom">
        @let bottomContent = dockBottom();
        @if (!!bottomContent) {
            <ng-container [ngTemplateOutlet]="bottomContent" />
        }
    </div>
    <div></div>
</div>
