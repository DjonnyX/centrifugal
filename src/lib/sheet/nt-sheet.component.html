  [overscrollAreaUseOffsets]="overscrollAreaUseOffsets()" [overscrollAreaLeftEnabled]="overscrollAreaLeftEnabled()"

  [overscrollAreaBottomEnabled]="overscrollAreaBottomEnabled()"

  [overscrollAreaRightRenderer]="overscrollAreaRightRenderer()"
  [overscrollAreaBottomRenderer]="overscrollAreaBottomRenderer()"
