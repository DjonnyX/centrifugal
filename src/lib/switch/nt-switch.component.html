@let filtered = motionBlurEnabled();
<div localeSensitive [langTextDir]="langTextDir()" [listDir]="direction()" class="ntsw__container"
    [ngClass]="containerClasses()">
    <svg part="nt-scroller-viewport" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink">
        <filter [id]="_filterId">
            <feGaussianBlur #filter></feGaussianBlur>
        </filter>
        <foreignObject xmlns="http://www.w3.org/1999/xhtml" width="100%" height="100%" class="ntsw__viewport">
            <div class="ntsw__scroller-wrapper" [class.filtered]="filtered"
                [style.filter]="filtered ? _filter : 'unset'" [ngStyle]="wrapperStyles()" [ngClass]="wrapperClass()">
                <div cdkScrollable #scrollViewport part="nt-scroller" class="ntsw__scroller">
                    <div #scrollContent [attr.aria-orientation]="direction()" tabindex="-1"
                        [attr.aria-activedescendant]="focusedElement()" part="nt-switch-content" class="ntsw__content"
                        [ngClass]="actualClasses()" [ngStyle]="listStyles()">
                        <ng-content></ng-content>
                    </div>
                </div>
            </div>
            <nt-overscroll-container class="ntoa" dir="ltr" [bounds]="viewportBounds()" [leftOffset]="_leftOffset()"
                [topOffset]="_topOffset()" [rightOffset]="_rightOffset()" [bottomOffset]="_bottomOffset()"
                [overscrollEvent]="$overscroll | async" [leftIndicatorEnabled]="_actualOverscrollAreaLeftEnabled()"
                [topIndicatorEnabled]="_actualOverscrollAreaTopEnabled()"
                [rightIndicatorEnabled]="_actualOverscrollAreaRightEnabled()"
                [bottomIndicatorEnabled]="_actualOverscrollAreaBottomEnabled()"
                [leftIndicatorRenderer]="overscrollAreaStartRenderer()"
                [topIndicatorRenderer]="overscrollAreaStartRenderer()"
                [rightIndicatorRenderer]="overscrollAreaEndRenderer()"
                [bottomIndicatorRenderer]="overscrollAreaEndRenderer()"
                (onLeftAreaTrigger)="onLeftOverscrollAreaTrigger.emit($event)"
                (onTopAreaTrigger)="onTopOverscrollAreaTrigger.emit($event)"
                (onRightAreaTrigger)="onRightOverscrollAreaTrigger.emit($event)"
                (onBottomAreaTrigger)="onBottomOverscrollAreaTrigger.emit($event)" />
        </foreignObject>
    </svg>
    <nt-slider class="ntsw-slider" part="nt-switch-slider" [min]="0" [max]="1" [step]="1" [value]="_sliderValue()"
        (onChange)="onChangeHandler($event)"></nt-slider>
</div>
