@let dir = direction();
@let isVertical = _isVertical();
<div #container class="ntsw__container" [ngClass]="_containerClass()">
    <nt-scroll-view #scroller class="ntsw__scroller" style="position: absolute;" [langTextDir]="langTextDir()"
        [direction]="dir" [interactive]="false" [scrollbarEnabled]="false" [overscrollEnabled]="false"
        [overscrollAreaShowAutomatically]="false" [overscrollAreaLeftEnabled]="!isVertical"
        [overscrollAreaRightEnabled]="!isVertical" [overscrollAreaTopEnabled]="isVertical"
        [overscrollAreaBottomEnabled]="isVertical">
        <div class="ntsw__switch-content" [style.width.px]="scroller.host.offsetWidth"
            [style.height.px]="scroller.host.offsetHeight" [ngStyle]="_scrollerContentStyle()">
            <ng-content></ng-content>
        </div>
    </nt-scroll-view>
    <nt-slider #slider class="ntsw__switch-slider" style="position: absolute;" part="nt-switch-slider"
        [langTextDir]="langTextDir()" [overscrollService]="_overscrollService" [renderer]="renderer()"
        [params]="params()" [overscrollEnabled]="false" [interactive]="interactive()"
        [style.width.px]="container.offsetWidth" [style.height.px]="container.offsetHeight" [direction]="dir" [min]="0"
        [max]="1" [step]="1" [value]="_sliderValue()" (onVirtualClick)="onVirtualClickHandler($event)"
        (onChange)="onChangeHandler($event)"></nt-slider>
</div>
