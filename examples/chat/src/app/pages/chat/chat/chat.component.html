@let searchText = search();
@let groupTitle = title();
<nt-scroll-view #scrollView class="scroll-view" [scrollTopOffset]="toolbarBounds().height"
    [overscrollAreaUseOffsets]="true" [motionBlurEnabled]="motionBlurEnabled" [scrollbarThickness]="2">
    <div class="wrapper">
        <div class="container">
            <div #toolbar localeSensitive class="toolbar enabled-dock-left">
                <div>
                    <x-menu-button name="menu-button" (onClick)="onOpenMenuHandler($event)"
                        [opened]="(drawer.$opened | async)!" />
                </div>
                <div #header class="title">{{groupTitle}}</div>
                <x-message-search (search)="onSearchHandler($event)" />
            </div>

            <div class="list-container">
                <nt-drawer #drawer class="drawer" [dockLeftSize]="menuSize()" [dockLeft]="dockLeft"
                    (onOpen)="onDrawerOpenHandler()" (onClose)="onDrawerCloseHandler()">
                    <ng-template #dockLeft>
                        <div class="drawer-dock">
                            <x-groups [scrollStartOffset]="toolbarBounds().height"
                                (select)="onGroupSelectHandler($event)" (close)="onGroupsCloseHandler()" />
                        </div>
                    </ng-template>
                    <div class="viewer-container">
                        <x-messages #messages [search]="searchText" [scrollStartOffset]="toolbarBounds().height"
                            [scrollEndOffset]="messageCreatorBounds().height" />
                        <div #messageCreator class="message-creator">
                            <x-messaage-creator #creator [creating]="isCreating()"
                                (onSend)="onSendMessageHandler($event)"></x-messaage-creator>
                        </div>
                    </div>
                </nt-drawer>
            </div>
        </div>
    </div>
</nt-scroll-view>
